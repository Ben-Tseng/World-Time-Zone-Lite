<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Time Zone Lite</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div>
        <h1>World Time Zone <span class="lite">Lite</span></h1>
        <p class="app-subtitle">Compare local time across cities at a glance</p>
      </div>
    </header>

    <div class="control-bar">
      <div class="search-container">
        <button class="search-icon" id="search-add-button" type="button" aria-label="Add location">+</button>
        <input type="text" id="location-search" placeholder="Place, country or timezone" autocomplete="off" aria-label="Search location">
        <div id="search-results" class="search-results"></div>
      </div>

      <div class="date-controls">
        <button id="today-button" class="today-btn" type="button">Today</button>
        <label for="date-picker-input" class="calendar-btn" title="Choose date" aria-label="Choose date">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM1 4v10a1 1 0 0 0 1 1V4H1z"/>
          </svg>
        </label>
        <input type="date" id="date-picker-input" aria-label="Choose date">
        <div class="date-strip-container" id="date-strip"></div>
      </div>
    </div>

    <div class="timeline-header">
      <div class="timeline-info-title">Location</div>
      <div class="timeline-legend">
        <span><i class="legend-swatch day"></i> Day</span>
        <span><i class="legend-swatch night"></i> Night</span>
        <span class="legend-hint">Hover to compare</span>
      </div>
    </div>

    <main class="timeline-container" id="timeline-container"></main>

    <div class="empty-state" id="empty-state" hidden>
      <div class="empty-icon">+</div>
      <strong>No locations</strong>
      <span>Add a city to start comparing time zones.</span>
      <button id="empty-add-button" type="button">Add a location</button>
    </div>

    <div class="selection-tooltip" id="selection-tooltip" aria-live="polite"></div>
    <div class="selection-overlay" id="selection-overlay"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
